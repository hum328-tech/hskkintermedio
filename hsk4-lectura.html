<style>
:root {
  --blue:#2563eb; --dark:#1e3a8a; --bg:#f4f7fb; --card:#fff; --soft:#eff6ff;
  --gold:#fef3c7; --green:#ecfdf5; --red:#dc2626; --purple:#7c3aed;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1f2937}
.app{max-width:1240px;margin:auto;padding:20px}
h1{text-align:center;color:var(--dark);margin:8px 0}
.nav,.game-controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:none;border-radius:14px;padding:11px 15px;background:var(--blue);color:white;font-weight:700;cursor:pointer;font-size:15px}
button:hover{filter:brightness(.92)}
button.secondary{background:#475569} button.danger{background:var(--red)} button.success{background:#059669}
.counter{font-weight:700;color:var(--dark);background:white;padding:10px 14px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.reader{font-size:28px;line-height:2.05}
.word{cursor:pointer;padding:4px 6px;border-radius:10px;display:inline-block;transition:.15s}
.word:hover{background:#dbeafe} .word.saved{background:var(--gold)}
.punct{display:inline-block;margin-right:4px}
#infoBox{margin-top:18px;background:var(--soft);border-left:6px solid var(--blue);border-radius:14px;padding:16px;display:none}
#infoWord{margin:0 0 8px;font-size:30px;color:#1d4ed8}
.pinyin{color:var(--purple);font-weight:700;margin:4px 0}
.translation{font-size:18px;margin:6px 0}
.grammar{background:white;border-radius:12px;padding:10px;margin-top:10px;font-size:16px}
.answer-box{margin-top:16px;padding:12px;border-radius:14px;background:var(--green);color:#065f46;font-weight:700;display:none}
.glossary-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.glossary-item{background:#f9fafb;border-radius:14px;padding:12px;margin:10px 0;border:1px solid #e5e7eb}
.glossary-item strong{font-size:22px;color:#111827} .empty{color:#6b7280;font-style:italic}
.hidden{display:none!important}
.game-panel{margin-top:18px;background:#fff7ed;border:2px solid #fed7aa;border-radius:20px;padding:18px;display:none}
.flash-card{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;background:white;border-radius:18px;padding:22px;font-size:34px;font-weight:800;box-shadow:inset 0 0 0 2px #fde68a}
.flash-sub{font-size:20px;font-weight:500;color:#6b7280;margin-top:8px}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.option-btn{background:white;color:#111827;border:2px solid #cbd5e1;text-align:center;min-height:62px}
.option-btn.correct{background:#dcfce7;border-color:#16a34a}
.option-btn.wrong{background:#fee2e2;border-color:#dc2626}
.small-note{text-align:center;color:#64748b;margin:8px 0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.reader{font-size:24px}.app{padding:12px}.option-grid{grid-template-columns:1fr}}
</style>
</head>

<div class="app">
<h1 id="readingTitle">Lecturas HSK</h1>

<div class="nav">
  <button onclick="prevReading()">⬅ Anterior</button>
  <span id="counter" class="counter"></span>
  <button onclick="nextReading()">Siguiente ➡</button>
  <button onclick="toggleGlossary()">📚 Mostrar/Ocultar glosario</button>
  <button onclick="toggleAnswer()">✅ Ver respuesta</button>
  <button class="success" onclick="openFlashcards()">🃏 Flashcards</button>
  <button class="success" onclick="openQuiz()">🎮 Opción múltiple</button>
</div>

<div id="gamePanel" class="game-panel">
  <div class="game-controls">
    <button onclick="setDirection('es-zh')">ES → 中文</button>
    <button onclick="setDirection('zh-es')">中文 → ES</button>
    <button onclick="togglePinyin()">👁️ Pinyin ON/OFF</button>
    <button onclick="speakCurrentChinese()">🔊 Escuchar chino</button>
    <button class="secondary" onclick="closeGames()">Cerrar juego</button>
  </div>
  <p class="small-note" id="gameModeLabel"></p>
  <div id="flashcardArea" class="hidden">
    <div class="flash-card" id="flashFront"></div>
    <div class="game-controls">
      <button onclick="flipFlashcard()">Voltear</button>
      <button onclick="nextFlashcard()">Siguiente tarjeta</button>
    </div>
  </div>
  <div id="quizArea" class="hidden">
    <div class="flash-card" id="quizQuestion"></div>
    <div class="option-grid" id="quizOptions"></div>
    <div class="game-controls"><button onclick="nextQuizQuestion()">Nueva pregunta</button></div>
  </div>
</div>

<div class="layout">
  <div class="card">
    <div id="reader" class="reader"></div>
    <div id="answerBox" class="answer-box"></div>
    <div id="infoBox">

    </div>

    <div id="glossaryList"></div>
  </div>
</div>
</div>

let currentReadingIndex = Number(localStorage.getItem("currentReadingIndexHSK")) || 0;
let glossary = JSON.parse(localStorage.getItem("globalHSKGlossary")) || [];
let answerVisible = false;
let gameType = "flash";
let direction = "zh-es";
let showPinyin = true;
let flashIndex = 0;
let flipped = false;
let currentQuizItem = null;

function cleanGlossaryItems(){
  return glossary.filter(x => !x.punctuation && x.text && x.translation);
}

function renderReader(){
  const reading = readings[currentReadingIndex];
  const reader = document.getElementById("reader");
  document.getElementById("readingTitle").textContent = reading.title;
  document.getElementById("counter").textContent = `${currentReadingIndex + 1} / ${readings.length}`;
  reader.innerHTML = "";

  reading.words.forEach(item => {
    if(item.punctuation){
      const span = document.createElement("span");
      span.className = "punct";
      span.textContent = item.text + " ";
      reader.appendChild(span);
      if(item.text === "。" || item.text === "：") reader.appendChild(document.createElement("br"));
      return;
    }
    const span = document.createElement("span");
    span.className = "word";
    if(glossary.some(g => g.text === item.text)) span.classList.add("saved");
    span.textContent = item.text;
    span.onclick = () => showInfo(item);
    reader.appendChild(span);
    reader.appendChild(document.createTextNode(" "));
  });
  renderAnswer();
}

function showInfo(item){
  document.getElementById("infoBox").style.display = "block";
  document.getElementById("infoWord").textContent = item.text;
  document.getElementById("infoPinyin").textContent = item.pinyin || "";
  document.getElementById("infoTranslation").textContent = item.translation || "";
  document.getElementById("infoGrammar").textContent = item.grammar ? "Gramática: " + item.grammar : "Sin explicación gramatical especial.";
  addToGlossary(item);
}

function addToGlossary(item){
  if(!glossary.some(g => g.text === item.text)){
    glossary.push(item);
    localStorage.setItem("globalHSKGlossary", JSON.stringify(glossary));
  }
  renderGlossary();
  renderReader();
}

function renderGlossary(){
  const list = document.getElementById("glossaryList");
  list.innerHTML = "";
  if(glossary.length === 0){
    list.innerHTML = '<p class="empty">Todavía no hay palabras guardadas.</p>';
    return;
  }
  glossary.forEach(item => {
    const div = document.createElement("div");
    div.className = "glossary-item";
    div.innerHTML = `<strong>${item.text}</strong>
      <div class="pinyin">${item.pinyin || ""}</div>
      <div>${item.translation || ""}</div>
      ${item.grammar ? `<small>📌 ${item.grammar}</small>` : ""}
      <div style="margin-top:8px"><button onclick='speakChinese(${JSON.stringify(item.text)})'>🔊</button></div>`;
    list.appendChild(div);
  });
}

function clearGlossary(){
  glossary = [];
  localStorage.removeItem("globalHSKGlossary");
  renderGlossary();
  renderReader();
}

function nextReading(){
  if(currentReadingIndex < readings.length - 1){
    currentReadingIndex++;
    localStorage.setItem("currentReadingIndexHSK", currentReadingIndex);
    document.getElementById("infoBox").style.display = "none";
    answerVisible = false;
    renderReader();
  }
}

function prevReading(){
  if(currentReadingIndex > 0){
    currentReadingIndex--;
    localStorage.setItem("currentReadingIndexHSK", currentReadingIndex);
    document.getElementById("infoBox").style.display = "none";
    answerVisible = false;
    renderReader();
  }
}

function toggleGlossary(){ document.getElementById("glossaryCard").classList.toggle("hidden"); }
function toggleAnswer(){ answerVisible = !answerVisible; renderAnswer(); }

function renderAnswer(){
  const box = document.getElementById("answerBox");
  const reading = readings[currentReadingIndex];
  if(answerVisible && reading.answer){
    box.style.display = "block";
    box.textContent = "Respuesta correcta: " + reading.answer;
  } else {
    box.style.display = "none";
  }
}

function openFlashcards(){
  if(cleanGlossaryItems().length === 0){ alert("Primero toca algunas palabras para agregarlas al glosario."); return; }
  gameType = "flash"; flipped = false; flashIndex = 0;
  document.getElementById("gamePanel").style.display = "block";
  document.getElementById("flashcardArea").classList.remove("hidden");
  document.getElementById("quizArea").classList.add("hidden");
  renderFlashcard();
}

function openQuiz(){
  if(cleanGlossaryItems().length < 4){ alert("Necesitas al menos 4 palabras en el glosario para opción múltiple."); return; }
  gameType = "quiz";
  document.getElementById("gamePanel").style.display = "block";
  document.getElementById("quizArea").classList.remove("hidden");
  document.getElementById("flashcardArea").classList.add("hidden");
  nextQuizQuestion();
}

function closeGames(){ document.getElementById("gamePanel").style.display = "none"; }
function setDirection(d){ direction = d; updateGameLabel(); if(gameType==="flash") renderFlashcard(); else nextQuizQuestion(); }
function togglePinyin(){ showPinyin = !showPinyin; if(gameType==="flash") renderFlashcard(); else renderQuizQuestion(currentQuizItem); }
function updateGameLabel(){
  document.getElementById("gameModeLabel").textContent =
    `Modo: ${direction === "zh-es" ? "Pregunta en chino → respuesta en español" : "Pregunta en español → respuesta en chino"} · Pinyin: ${showPinyin ? "visible" : "oculto"}`;
}

function renderFlashcard(){
  updateGameLabel();
  const items = cleanGlossaryItems();
  const item = items[flashIndex % items.length];
  const front = document.getElementById("flashFront");
  const chinese = `<div>${item.text}</div>${showPinyin ? `<div class="flash-sub">${item.pinyin || ""}</div>` : ""}`;
  const spanish = `<div>${item.translation}</div>`;
  if(!flipped){
    front.innerHTML = direction === "zh-es" ? chinese : spanish;
  } else {
    front.innerHTML = direction === "zh-es" ? spanish : chinese;
  }
}

function flipFlashcard(){ flipped = !flipped; renderFlashcard(); }
function nextFlashcard(){ flashIndex++; flipped = false; renderFlashcard(); }

function nextQuizQuestion(){
  const items = cleanGlossaryItems();
  currentQuizItem = items[Math.floor(Math.random()*items.length)];
  renderQuizQuestion(currentQuizItem);
}

function renderQuizQuestion(item){
  if(!item) return;
  updateGameLabel();
  const q = document.getElementById("quizQuestion");
  const options = document.getElementById("quizOptions");
  const items = cleanGlossaryItems();
  const correct = item;
  const pool = items.filter(x => x.text !== correct.text).sort(() => Math.random() - 0.5).slice(0,3);
  const all = [correct, ...pool].sort(() => Math.random() - 0.5);

  if(direction === "zh-es"){
    q.innerHTML = `<div>${correct.text}</div>${showPinyin ? `<div class="flash-sub">${correct.pinyin || ""}</div>` : ""}`;
  } else {
    q.innerHTML = `<div>${correct.translation}</div>`;
  }

  options.innerHTML = "";
  all.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = direction === "zh-es"
      ? opt.translation
      : `${opt.text}${showPinyin ? `<div class="flash-sub">${opt.pinyin || ""}</div>` : ""}`;
    btn.onclick = () => {
      if(opt.text === correct.text){
        btn.classList.add("correct");
        speakChinese(correct.text);
      } else {
        btn.classList.add("wrong");
      }
    };
    options.appendChild(btn);
  });
}

function speakChinese(text){
  if(!("speechSynthesis" in window)){
    alert("Este navegador no soporta voz.");
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 0.78;
  utter.pitch = 1;
  speechSynthesis.speak(utter);
}

function speakCurrentChinese(){
  let item = null;
  if(gameType === "flash") item = cleanGlossaryItems()[flashIndex % cleanGlossaryItems().length];
  if(gameType === "quiz") item = currentQuizItem;
  if(item) speakChinese(item.text);
}

renderReader();
renderGlossary();
updateGameLabel();
</script>
