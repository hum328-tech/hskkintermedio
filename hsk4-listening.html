<meta charset="UTF-8">

<title>HSK4 · Laboratorio de audio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#f5f7fb;color:#20242a}
.wrap{max-width:780px;margin:0 auto;padding:18px}
h1{font-size:24px;margin:0 0 8px}
.sub{color:#606774;margin-bottom:18px}
.card,.practice-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.07)}
.fragment,.review-item{border:2px solid #e6eaf0;border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}
.num,.progress{font-size:14px;font-weight:bold;color:#6b7280;margin-bottom:8px}
.hanzi{font-size:27px;line-height:1.45;margin-bottom:12px}
.blurred{filter:blur(8px);user-select:none;transition:filter .25s ease}
.blurred.visible{filter:blur(0);user-select:text}
button{width:100%;min-height:52px;border:0;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.99)}
.play,.back,.practice-btn,.check-btn,.next-audio{background:#222;color:#fff}
.show-text,.review-top,.remove,.prev-audio,.next-btn{background:#e8edf5;color:#20242a}
.didnt-understand{background:#fff1f1;color:#9f1d1d;margin-top:10px}
.show-text{margin-bottom:10px}
.review-top{margin:0 0 16px}
.controls{display:grid;gap:10px;margin-top:16px}
.nav-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.nav-controls.one{grid-template-columns:1fr}
.review-screen,.transcription-screen{display:none}
.back{margin-bottom:16px}
.empty-review{background:#fff;border-radius:16px;padding:20px;text-align:center;color:#6b7280}
.practice-btn{margin-bottom:14px}
.remove{margin-top:10px}
.transcription-input{width:100%;min-height:58px;border:2px solid #dfe3ea;border-radius:14px;padding:12px 14px;font-size:22px;font-family:Arial,"Noto Sans SC",sans-serif;margin:12px 0 10px}
.feedback{min-height:28px;margin-top:12px;font-weight:bold;text-align:center}
.success{color:#19733a}.error{color:#b42318}
.next-btn{margin-top:10px;display:none}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f6;color:#59616d;font-size:13px;font-weight:bold;margin-bottom:12px}
@media(max-width:520px){
  .wrap{padding:12px}
  .hanzi{font-size:24px}
  .nav-controls{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<section id="lessonScreen">
  <h1 id="lessonTitle">HSK4 · Audio 1</h1>
  <div class="sub">Escucha primero el audio completo y después trabaja cada parte.</div>
  <button class="review-top" onclick="openReview()">🔁 Repasar audios <span id="reviewCount"></span></button>
  <div id="lessonContent"></div>
</section>

<section id="reviewScreen" class="review-screen">
  <button class="back" onclick="closeReview()">← Volver a los audios</button>
  <h1>Repasar audios</h1>
  <div class="sub">Aquí se acumulan las partes que marcaste como “No entendí”.</div>
  <button class="practice-btn" onclick="startTranscriptionPractice()">✍ Practicar transcripción</button>
  <div id="reviewList"></div>
</section>

<section id="transcriptionScreen" class="transcription-screen">
  <button class="back" onclick="exitTranscriptionPractice()">← Volver a repasar audios</button>
  <h1>Práctica de transcripción</h1>
  <div class="sub">Escucha y escribe los caracteres. La puntuación y los espacios no cuentan.</div>
  <div class="practice-card">
    <div class="progress" id="transcriptionProgress"></div>
    <button class="play" onclick="playCurrentTranscription()">▶ Escuchar audio</button>
    <input id="transcriptionInput" class="transcription-input" type="text"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      placeholder="Escribe aquí lo que escuchas">
    <button class="check-btn" onclick="checkTranscription()">Comprobar</button>
    <div id="transcriptionFeedback" class="feedback"></div>
    <button id="nextTranscriptionBtn" class="next-btn" onclick="nextTranscription()">Siguiente audio →</button>
  </div>
</section>

</div>

let currentLessonIndex = 0;
const REVIEW_KEY = "hsk4_review_audios_v2";

function speak(text, onEnd){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 0.82;
  u.pitch = 1;
  if(onEnd) u.onend = onEnd;
  speechSynthesis.speak(u);
}

function getReviewItems(){
  try{return JSON.parse(localStorage.getItem(REVIEW_KEY)) || []}
  catch(e){return []}
}
function setReviewItems(items){
  localStorage.setItem(REVIEW_KEY, JSON.stringify(items));
  updateReviewCount();
}
function itemId(lessonId, partIndex){ return `audio${lessonId}-parte${partIndex+1}`; }

function renderLesson(){
  const lesson = lessons[currentLessonIndex];
  document.getElementById("lessonTitle").textContent = `HSK4 · Audio ${lesson.id}`;

  const content = document.getElementById("lessonContent");
  content.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";

  const complete = document.createElement("div");
  complete.className = "fragment";
  complete.innerHTML = `
    <div class="num">Audio completo</div>
    <div class="hanzi blurred" id="completeText">${lesson.complete}</div>
    <button class="show-text" onclick="toggleText('completeText', this, 'Mostrar texto completo')">Mostrar texto completo</button>
    <button class="play" onclick="speak(lessons[currentLessonIndex].complete)">▶ Escuchar audio completo</button>
  `;
  card.appendChild(complete);

  lesson.parts.forEach((text, idx)=>{
    const saved = getReviewItems().some(x => x.id === itemId(lesson.id, idx));
    const block = document.createElement("div");
    block.className = "fragment";
    block.innerHTML = `
      <div class="num">Parte ${idx+1} de ${lesson.parts.length}</div>
      <div class="hanzi blurred" id="partText${idx}">${text}</div>
      <button class="show-text" onclick="toggleText('partText${idx}', this, 'Mostrar texto parte ${idx+1}')">Mostrar texto parte ${idx+1}</button>
      <button class="play" onclick="speak(lessons[currentLessonIndex].parts[${idx}])">▶ Escuchar parte ${idx+1}</button>
      <button class="didnt-understand" ${saved ? "disabled" : ""} onclick="saveForReview(${idx}, this)">
        ${saved ? "✓ Guardado para repasar" : "No entendí esta parte"}
      </button>
    `;
    card.appendChild(block);
  });

  const nav = document.createElement("div");
  const first = currentLessonIndex === 0;
  const last = currentLessonIndex === lessons.length - 1;
  nav.className = "nav-controls" + (first || last ? " one" : "");

  if(!first){
    const prev = document.createElement("button");
    prev.className = "prev-audio";
    prev.textContent = "← Audio anterior";
    prev.onclick = ()=>goLesson(-1);
    nav.appendChild(prev);
  }
  if(!last){
    const next = document.createElement("button");
    next.className = "next-audio";
    next.textContent = "Siguiente audio →";
    next.onclick = ()=>goLesson(1);
    nav.appendChild(next);
  }
  card.appendChild(nav);
  content.appendChild(card);
  updateReviewCount();
}

function goLesson(delta){
  currentLessonIndex += delta;
  currentLessonIndex = Math.max(0, Math.min(lessons.length-1, currentLessonIndex));
  speechSynthesis.cancel();
  renderLesson();
  window.scrollTo(0,0);
}

function toggleText(id, button, baseLabel){
  const el = document.getElementById(id);
  const visible = el.classList.toggle("visible");
  button.textContent = visible ? "Ocultar texto" : baseLabel;
}

function saveForReview(partIndex, button){
  const lesson = lessons[currentLessonIndex];
  const id = itemId(lesson.id, partIndex);
  const items = getReviewItems();
  if(!items.some(x=>x.id===id)){
    items.push({
      id,
      lessonId: lesson.id,
      part: partIndex+1,
      text: lesson.parts[partIndex]
    });
    setReviewItems(items);
  }
  button.textContent = "✓ Guardado para repasar";
  button.disabled = true;
}

function updateReviewCount(){
  const n = getReviewItems().length;
  document.getElementById("reviewCount").textContent = n ? `(${n})` : "";
}

function openReview(){
  document.getElementById("lessonScreen").style.display="none";
  document.getElementById("transcriptionScreen").style.display="none";
  document.getElementById("reviewScreen").style.display="block";
  renderReview(true);
  window.scrollTo(0,0);
}
function closeReview(){
  document.getElementById("reviewScreen").style.display="none";
  document.getElementById("lessonScreen").style.display="block";
  renderLesson();
  window.scrollTo(0,0);
}

function removeReview(id){
  setReviewItems(getReviewItems().filter(x=>x.id!==id));
  renderReview();
}

function shuffleArray(items){
  const shuffled = [...items];
  for(let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function renderReview(randomize=false){
  const list = document.getElementById("reviewList");
  const storedItems = getReviewItems();
  const items = randomize ? shuffleArray(storedItems) : storedItems;
  if(!items.length){
    list.innerHTML='<div class="empty-review">Todavía no has marcado ningún audio para repasar.</div>';
    return;
  }
  list.innerHTML="";
  items.forEach(item=>{
    const box=document.createElement("div");
    box.className="review-item";

    const badge=document.createElement("div");
    badge.className="badge";
    badge.textContent=`Audio ${item.lessonId} · Parte ${item.part}`;

    const txt=document.createElement("div");
    txt.className="hanzi blurred";
    txt.textContent=item.text;

    const show=document.createElement("button");
    show.className="show-text";
    show.textContent="Mostrar texto";
    show.onclick=()=>{
      const v=txt.classList.toggle("visible");
      show.textContent=v?"Ocultar texto":"Mostrar texto";
    };

    const play=document.createElement("button");
    play.className="play";
    play.textContent="▶ Escuchar otra vez";
    play.onclick=()=>speak(item.text);

    const remove=document.createElement("button");
    remove.className="remove";
    remove.textContent="✓ Ya entendí · quitar de repaso";
    remove.onclick=()=>removeReview(item.id);

    box.append(badge,txt,show,play,remove);
    list.appendChild(box);
  });
}

let transcriptionItems=[];
let transcriptionIndex=0;

function startTranscriptionPractice(){
  transcriptionItems=shuffleArray(getReviewItems());
  if(!transcriptionItems.length){
    alert("Primero marca al menos una parte como “No entendí esta parte”.");
    return;
  }
  transcriptionIndex=0;
  document.getElementById("reviewScreen").style.display="none";
  document.getElementById("transcriptionScreen").style.display="block";
  loadTranscriptionItem();
  window.scrollTo(0,0);
}
function exitTranscriptionPractice(){
  speechSynthesis.cancel();
  document.getElementById("transcriptionScreen").style.display="none";
  document.getElementById("reviewScreen").style.display="block";
  renderReview();
  window.scrollTo(0,0);
}
function loadTranscriptionItem(){
  const item=transcriptionItems[transcriptionIndex];
  document.getElementById("transcriptionProgress").textContent=
    `Audio ${transcriptionIndex+1} de ${transcriptionItems.length} · HSK4 audio ${item.lessonId}, parte ${item.part}`;
  const input=document.getElementById("transcriptionInput");
  input.value=""; input.disabled=false;
  const feedback=document.getElementById("transcriptionFeedback");
  feedback.textContent=""; feedback.className="feedback";
  const next=document.getElementById("nextTranscriptionBtn");
  next.style.display="none";
  next.textContent=transcriptionIndex===transcriptionItems.length-1?"Terminar práctica":"Siguiente audio →";
}
function playCurrentTranscription(){
  if(transcriptionItems.length) speak(transcriptionItems[transcriptionIndex].text);
}
function normalizeTranscription(text){
  const chars=String(text||"").normalize("NFKC").match(/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g);
  return chars?chars.join(""):"";
}
function checkTranscription(){
  const expected=normalizeTranscription(transcriptionItems[transcriptionIndex].text);
  const answer=normalizeTranscription(document.getElementById("transcriptionInput").value);
  const feedback=document.getElementById("transcriptionFeedback");
  const input=document.getElementById("transcriptionInput");
  const next=document.getElementById("nextTranscriptionBtn");

  if(answer===expected){
    feedback.textContent="✓ Correcto.";
    feedback.className="feedback success";
    input.disabled=true;
    next.style.display="block";
  }else{
    let i=0, max=Math.max(answer.length,expected.length);
    while(i<max && answer[i]===expected[i]) i++;
    feedback.textContent=`✕ Revisa el carácter ${i+1}: escribiste “${answer[i]||"∅"}” y debería ser “${expected[i]||"∅"}”.`;
    feedback.className="feedback error";
    next.style.display="none";
  }
}
function nextTranscription(){
  if(transcriptionIndex>=transcriptionItems.length-1){
    exitTranscriptionPractice();
    return;
  }
  transcriptionIndex++;
  loadTranscriptionItem();
  playCurrentTranscription();
}
document.getElementById("transcriptionInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();checkTranscription();}
});

renderLesson();
</script>
